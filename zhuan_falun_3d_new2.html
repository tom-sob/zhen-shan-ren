<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vyučování Fa - 3D Edice</title>

<style>
    body {
        margin: 0; height: 100dvh; overflow: hidden; font-family: sans-serif;
        user-select: none; background: url(images/table_background.jpg) center/cover;
        background-color: #2c3e50;
        display: flex; justify-content: center; align-items: center; perspective: 3000px;
    }

    #ui {
        position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,.6); color: white;
        padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
        z-index: 10000;
    }

    .ui-btn {
        width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,.6); border-radius: 6px; cursor: pointer; font-size: 20px;
    }

    .nav {
        position: fixed; top: 50%; transform: translateY(-50%); font-size: 60px;
        color: white; cursor: pointer; padding: 30px; z-index: 9999;
        text-shadow: 0 2px 6px rgba(0,0,0,.85);
    }
    #prev { left: 10px; }
    #next { right: 10px; }

    #container-master {
        width: 100vw; height: 100vh;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
    }

    #book-viewport {
        position: relative;
        transform-style: preserve-3d;
        display: flex; justify-content: center; align-items: center;
    }

    #book {
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.3s ease-out;
    }

    .sheet {
        position: absolute; 
        width: 100.2%; height: 100%; 
        top: 0; left: 0;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        transform-origin: left center;
        pointer-events: none;
        margin-left: -0.2px;
    }

    .page-side {
        position: absolute; inset: 0; backface-visibility: hidden;
        background: white; overflow: hidden;
        /* Firefox fix pro ostrost vrstev */
        transform: translateZ(0);
    }

    /* PŮVODNÍ STÍNY */
    .page-front::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 10%);
        pointer-events: none;
    }

    .page-back { transform: rotateY(180deg); }

    .page-back::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(to left, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 20%);
        pointer-events: none;
    }

    .flipped { transform: rotateY(-180deg); }

    canvas { 
        width: 100%; height: 100%; display: block; 
        /* Vypnutí interpolace pro maximální ostrost textu */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
    }

    #loader {
        position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
        z-index: 20000; background: rgba(0,0,0,0.4); display: none;
    }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,.2); border-top: 4px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div id="ui">
    <div id="fsBtn" class="ui-btn">⛶</div>
    <div id="zoomOut" class="ui-btn">−</div>
    <div id="zoomIn" class="ui-btn">+</div>
    <span id="pageInfo">1 / ?</span>
    <input id="pageInput" type="number" min="1" placeholder="Pg" style="width:55px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 4px; text-align: center;">
</div>

<div id="prev" class="nav">❮</div>
<div id="next" class="nav">❯</div>

<div id="container-master">
    <div id="book-viewport">
        <div id="book"></div>
    </div>
</div>

<script src="./js/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "./js/pdf.worker.min.js";

    const url = "zhuan_falun.pdf";
    let pdfDoc = null, currentSheetIdx = 0, currentScale = 1;
    let posX = 0, posY = 0, isDragging = false, startX, startY;
    let pdfRatio = 1;
    let inputTimer = null;

    const sheets = [], book = document.getElementById("book"), 
          viewport = document.getElementById("book-viewport"),
          master = document.getElementById("container-master"),
          pageInput = document.getElementById("pageInput");

    async function resizeBook() {
        if (!pdfDoc) return;
        
        const availW = window.innerWidth * 0.93;
        const availH = window.innerHeight * 0.93;
        
        let newH = availH;
        let newW = newH * (pdfRatio * 2);
        
        if (newW > availW) {
            newW = availW;
            newH = newW / (pdfRatio * 2);
        }
        
        const sheetW = newW / 2;
        book.style.width = sheetW + "px";
        book.style.height = newH + "px";
        book.style.left = (sheetW / 2) + "px"; 

        sheets.forEach(sh => sh.querySelectorAll('canvas').forEach(c => delete c.dataset.renderedScale));
        await renderVisiblePages();
    }

    window.addEventListener('resize', () => {
        clearTimeout(window.resTimer);
        window.resTimer = setTimeout(resizeBook, 200);
    });

    async function loadPDF() {
        pdfDoc = await pdfjsLib.getDocument(url).promise;
        document.getElementById("pageInfo").textContent = `1 / ${pdfDoc.numPages}`;
        pageInput.max = pdfDoc.numPages;
        
        const page1 = await pdfDoc.getPage(1);
        const vp1 = page1.getViewport({ scale: 1 });
        pdfRatio = vp1.width / vp1.height;
        
        for (let i = 1; i <= pdfDoc.numPages; i += 2) {
            createSheetStructure(i, i + 1);
        }
        
        await resizeBook();
        document.getElementById("loader").style.display = "none";
        await updateView(false);
    }

    function createSheetStructure(fNum, bNum) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        sheet.appendChild(createPageSide(fNum, 'page-front'));
        sheet.appendChild(createPageSide(bNum, 'page-back'));
        book.appendChild(sheet);
        sheets.push(sheet);
    }

    function createPageSide(num, sideClass) {
        const side = document.createElement('div');
        side.className = 'page-side ' + sideClass;
        if (num <= pdfDoc.numPages) {
            side.dataset.pageNum = num;
            side.appendChild(document.createElement('canvas'));
        }
        return side;
    }

    async function renderVisiblePages() {
        if (!pdfDoc) return;
        const visibleIndices = [currentSheetIdx, currentSheetIdx - 1, currentSheetIdx + 1];
        
        for (const idx of visibleIndices) {
            if (idx < 0 || idx >= sheets.length) continue;
            const sides = sheets[idx].querySelectorAll('.page-side[data-page-num]');
            
            for (const side of sides) {
                const canvas = side.querySelector('canvas');
                if (canvas.dataset.renderedScale == currentScale) continue;
                
                const pageNum = parseInt(side.dataset.pageNum);
                const page = await pdfDoc.getPage(pageNum);
                
                const bookHeightPx = parseFloat(book.style.height);
                const renderScale = (bookHeightPx * currentScale) / page.getViewport({ scale: 1 }).height;
                
                const vp = page.getViewport({ scale: renderScale });
                // Pro Firefox zvýšíme hustotu pixelů pro extra ostrost
                const dpr = window.devicePixelRatio || 1;
                
                canvas.width = Math.floor(vp.width * dpr);
                canvas.height = Math.floor(vp.height * dpr);
                canvas.dataset.renderedScale = currentScale;
                
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                await page.render({
                    canvasContext: ctx, 
                    viewport: vp
                }).promise;
            }
        }
    }

    function resetPosition(forceOdzoom = false) {
        if (forceOdzoom) currentScale = 1;
        posX = 0; posY = 0;
        viewport.style.transform = `translate(0px, 0px)`;
        book.style.transform = `scale(${currentScale})`;
        master.style.cursor = currentScale > 1 ? "grab" : "default";
    }

    async function updateView(animate = true) {
        sheets.forEach((sheet, i) => {
            const isFlipped = i < currentSheetIdx;
            if (sheet.classList.contains('flipped') !== isFlipped) {
                sheet.style.zIndex = 1000;
                setTimeout(() => setZIndex(sheet, i), 600);
            } else {
                setZIndex(sheet, i);
            }
            if (isFlipped) sheet.classList.add('flipped');
            else sheet.classList.remove('flipped');
        });

        function setZIndex(sheet, i) {
            sheet.style.zIndex = (i < currentSheetIdx) ? (100 + i) : (100 - i);
        }
        
        let pNum = currentSheetIdx === 0 ? 1 : currentSheetIdx * 2;
        if (pNum > pdfDoc.numPages) pNum = pdfDoc.numPages;
        document.getElementById("pageInfo").textContent = `${pNum} / ${pdfDoc.numPages}`;
        if (document.activeElement !== pageInput) pageInput.value = pNum;
        
        resetPosition(true);
        await renderVisiblePages(); 
    }

    async function goToPage(p) {
        const val = parseInt(p);
        if (isNaN(val) || val < 1) return;
        let targetIdx = val === 1 ? 0 : Math.floor(val / 2);
        if (targetIdx >= sheets.length) targetIdx = sheets.length;
        if (targetIdx === currentSheetIdx) return;

        const direction = targetIdx > currentSheetIdx ? 1 : -1;
        const distance = Math.abs(targetIdx - currentSheetIdx);
        
        for (let i = 0; i < distance; i++) {
            currentSheetIdx += direction;
            updateView();
            await new Promise(r => setTimeout(r, distance > 5 ? 30 : 100));
        }
    }

    pageInput.addEventListener('input', (e) => {
        clearTimeout(inputTimer);
        inputTimer = setTimeout(() => {
            if (e.target.value) goToPage(e.target.value);
        }, 500);
    });

    const next = () => { if (currentSheetIdx < sheets.length) { currentSheetIdx++; updateView(); } };
    const prev = () => { if (currentSheetIdx > 0) { currentSheetIdx--; updateView(); } };

    document.getElementById("next").onclick = next;
    document.getElementById("prev").onclick = prev;

    window.addEventListener("keydown", e => {
        if (document.activeElement === pageInput) return;
        if (e.key === "ArrowRight" || e.key === " ") next();
        if (e.key === "ArrowLeft") prev();
    });

    window.addEventListener("wheel", e => {
        if (Math.abs(e.deltaY) > 50) {
            if (e.deltaY > 0) next(); else prev();
        }
    }, { passive: true });

    master.onmousedown = e => {
        if (currentScale <= 1) return;
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
        master.style.cursor = "grabbing";
    };
    window.onmousemove = e => {
        if (!isDragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        viewport.style.transform = `translate(${posX}px, ${posY}px)`;
    };
    window.onmouseup = () => {
        isDragging = false;
        master.style.cursor = currentScale > 1 ? "grab" : "default";
    };

    async function changeZoom(delta) {
        document.getElementById("loader").style.display = "flex";
        currentScale = Math.max(1, currentScale + delta);
        resetPosition(false);
        await renderVisiblePages();
        document.getElementById("loader").style.display = "none";
    }

    document.getElementById("zoomIn").onclick = () => changeZoom(0.5);
    document.getElementById("zoomOut").onclick = () => changeZoom(-0.5);
    
    document.getElementById("fsBtn").onclick = () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => setTimeout(resizeBook, 300));
        } else {
            document.exitFullscreen().then(() => setTimeout(resizeBook, 300));
        }
    };

    loadPDF();
</script>
</body>
</html>
