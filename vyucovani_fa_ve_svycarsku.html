<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<!-- důležité pro mobil -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vyučování Fa na Fa konferenci ve Švýcarsku</title>

<style>

body{
margin:0;
height:100dvh;
overflow:hidden;
font-family:sans-serif;
user-select:none;
background:url(images/table_background.jpg);
background-size:cover;
}

/* LOADER */

#loader{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:200000;
}

.spinner{
width:70px;
height:70px;
border:6px solid rgba(255,255,255,.2);
border-top:6px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
from{transform:rotate(0);}
to{transform:rotate(360deg);}
}

/* UI */

#ui{
position:fixed;
top:10px;
right:10px;
background:rgba(0,0,0,.6);
color:white;
padding:10px;
border-radius:8px;
display:flex;
align-items:center;
gap:8px;
z-index:10000;
transition:.3s;
}

.ui-btn{
width:clamp(34px,10vw,48px);
height:clamp(34px,10vw,48px);
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.6);
border-radius:6px;
cursor:pointer;
font-size:clamp(18px,5vw,26px);
}

#pageInput{
width:clamp(60px,18vw,90px);
font-size:clamp(14px,4vw,18px);
}

/* NAV */

.nav{
position:fixed;
top:50%;
transform:translateY(-50%);
font-size:clamp(40px,8vw,70px);
color:white;
cursor:pointer;
padding:clamp(10px,4vw,30px);
z-index:99999;
text-shadow:0 2px 6px rgba(0,0,0,.85);
}

#prev{left:10px;}
#next{right:10px;}

/* VIEW */

#viewport{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
visibility:hidden;
}

#viewer{
display:flex;
gap:0;
cursor:grab;
}

#viewer.dragging{
cursor:grabbing;
}

#page2{
box-shadow:
inset 30px 0 50px rgba(0,0,0,.25),
25px 0 45px rgba(0,0,0,.30),
0 40px 80px rgba(0,0,0,.28);
}

#page1{
box-shadow:
inset -40px 0 60px rgba(0,0,0,.35),
-35px 0 55px rgba(0,0,0,.35),
0 40px 80px rgba(0,0,0,.28);
}

canvas{background:white;}

.hidden-ui{
opacity:0;
pointer-events:none;
}

/* větší ovládání na mobilech */

@media (pointer:coarse){
.nav{font-size:70px;}
.ui-btn{
width:48px;
height:48px;
font-size:26px;
}
}

</style>
</head>

<body>

<div id="loader"><div class="spinner"></div></div>

<div id="ui">
<div id="fsBtn" class="ui-btn">⛶</div>
<div id="zoomOut" class="ui-btn">−</div>
<div id="zoomIn" class="ui-btn">+</div>
<span id="pageInfo">1 / ?</span>
<input id="pageInput" type="number" min="1">
</div>

<div id="prev" class="nav">❮</div>
<div id="next" class="nav">❯</div>

<div id="viewport">
<div id="viewer">
<canvas id="page1"></canvas>
<canvas id="page2"></canvas>
</div>
</div>

<script src="./js/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc="./js/pdf.worker.min.js";

const url="vyucovani_fa_ve_svycarsku.pdf";

let pdfDoc;
let currentPage=1;
let baseScale=1;
let scale=1;

let ox=0,oy=0;
let dragging=false,sx=0,sy=0;

const viewer=document.getElementById("viewer");
const c1=document.getElementById("page1");
const c2=document.getElementById("page2");

const pageInput=document.getElementById("pageInput");
const pageInfo=document.getElementById("pageInfo");

const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const fsBtn=document.getElementById("fsBtn");

/* UI AUTO HIDE */

const uiElements=[
document.getElementById("ui"),
document.getElementById("prev"),
document.getElementById("next")
];

let hideTimer;

function showUI(){
uiElements.forEach(el=>el.classList.remove("hidden-ui"));
clearTimeout(hideTimer);
hideTimer=setTimeout(()=>uiElements.forEach(el=>el.classList.add("hidden-ui")),5000);
}

["mousemove","mousedown","touchstart","keydown"]
.forEach(e=>window.addEventListener(e,showUI));

/* FULLSCREEN */

fsBtn.onclick=()=>{
if(!document.fullscreenElement)
document.documentElement.requestFullscreen();
else
document.exitFullscreen();
};

/* DRAG */

function startDrag(x,y){
dragging=true;
sx=x-ox;
sy=y-oy;
viewer.classList.add("dragging");
}

function moveDrag(x,y){
if(!dragging)return;
ox=x-sx;
oy=y-sy;
viewer.style.transform=`translate(${ox}px,${oy}px)`;
}

function endDrag(){
dragging=false;
viewer.classList.remove("dragging");
}

viewer.onmousedown=e=>startDrag(e.clientX,e.clientY);
window.onmousemove=e=>moveDrag(e.clientX,e.clientY);
window.onmouseup=endDrag;

viewer.ontouchstart=e=>{
const t=e.touches[0];
startDrag(t.clientX,t.clientY);
};

viewer.ontouchmove=e=>{
const t=e.touches[0];
moveDrag(t.clientX,t.clientY);
};

viewer.ontouchend=endDrag;

/* ZOOM */

function zoom(dir){

const prev=scale;
const z=scale/baseScale;

scale=baseScale*(dir>0?z+0.1:Math.max(1,z-0.1));

const ratio=scale/prev;

ox*=ratio;
oy*=ratio;

viewer.style.transform=`translate(${ox}px,${oy}px)`;

draw();
}

zoomIn.onclick=()=>zoom(1);
zoomOut.onclick=()=>zoom(-1);

/* PAGE CHANGE */

function nextPage(){
if(currentPage<pdfDoc.numPages) go(currentPage+1);
}

function prevPage(){
if(currentPage>1) go(currentPage-1);
}

next.onclick=nextPage;
prev.onclick=prevPage;

pageInput.oninput=e=>{
let p=parseInt(e.target.value);
if(!p)return;
go(Math.max(1,Math.min(pdfDoc.numPages,p)));
};

/* PDF */

async function render(num,canvas){

const page=await pdfDoc.getPage(num);
const vp=page.getViewport({scale});

const ctx=canvas.getContext("2d");
const dpr=devicePixelRatio||1;

canvas.width=vp.width*dpr;
canvas.height=vp.height*dpr;

canvas.style.width=vp.width+"px";
canvas.style.height=vp.height+"px";

ctx.setTransform(1,0,0,1,0,0);
ctx.scale(dpr,dpr);

await page.render({canvasContext:ctx,viewport:vp}).promise;
}

async function draw(){

pageInfo.textContent=`${currentPage} / ${pdfDoc.numPages}`;
pageInput.value=currentPage;

await render(currentPage,c1);
c2.style.display="none";
}

async function go(p){

currentPage=p;

const page=await pdfDoc.getPage(1);
const vp=page.getViewport({scale:1});

const w=innerWidth*0.93;
const h=innerHeight*0.93;

baseScale=Math.min(w/vp.width,h/vp.height);
scale=baseScale;

ox=oy=0;
viewer.style.transform="translate(0,0)";

await draw();
}

/* LOAD */

pdfjsLib.getDocument(url).promise.then(async pdf=>{
pdfDoc=pdf;

await go(1);

document.getElementById("viewport").style.visibility="visible";
document.getElementById("loader").style.display="none";

showUI();
});

</script>
</body>
</html>
